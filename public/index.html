<!doctype html>
<html lang="fil">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Zoom stays allowed (never set maximum-scale): residents may need 200% text. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="KolektaPH: kailan darating ang garbage truck sa inyong barangay sa Carmona. Live na mapa, text alerts, at report ng basura."
    />
    <meta name="theme-color" content="#15314B" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KolektaPH" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Same cream as the app, so there is no white flash while it loads. */
        background-color: #f4f1ea;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Kailangan ng JavaScript para gumana ang KolektaPH. / KolektaPH needs JavaScript to run.
    </noscript>
    <div id="root"></div>
  </body>
</html>
